[workspace]
members = ["crates/fmi"]

[package]
name = "rs-lra"
version = "0.1.0"
edition = "2021"
description = "Rapid Sparse Long-Read Aligner"
license = "MIT"
readme = "README.md"

[lib]
name = "rs_lra"
path = "src/lib.rs"

[[bin]]
name = "rs-lra"
path = "src/main.rs"

[dependencies]
fmi = { path = "crates/fmi" }
bincode = "1.3"
crc32fast = "1.5"
flate2 = "1.0"
ksw2rs = "0.2"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[patch.crates-io]
ksw2rs = { path = "../ksw2rs_extd2" }
