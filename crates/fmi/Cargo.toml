[package]
name = "fmi"
version = "0.1.0"
edition = "2021"
description = "The FlashMap .fmi packed minimizer index format: build, read, and the policies that shape it"
license = "MIT"

[dependencies]
bincode = "1.3"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
